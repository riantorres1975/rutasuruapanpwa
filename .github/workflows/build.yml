name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify route data
        run: |
          ROUTES=$(node -e "const d=require('./data/rutas_produccion_final.json'); console.log(d.length)")
          echo "Routes available: $ROUTES"
          if [ "$ROUTES" -lt 1 ]; then
            echo "Route data is empty"
            exit 1
          fi
