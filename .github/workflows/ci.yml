name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # El build no necesita secretos: sin token de Mapbox las vistas
          # previas caen al SVG local y el chat responde 503 solo en runtime.
          NEXT_PUBLIC_SITE_URL: https://www.urugo.app
